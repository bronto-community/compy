# GoReleaser config: tagged releases (v*) via .github/workflows/release.yml,
# which runs on a macOS runner because the darwin builds need cgo (systray,
# Wails window). Local dry run:
#
#   go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean
#
# Beyond the compy binaries, a post-build hook (.github/scripts/
# goreleaser-extras.sh) produces the otelcol-compy collector tarballs and
# the compy.app zip (release.extra_files picks them up from dist/extra/),
# plus a per-arch staging dir (dist/stage/<os>_<arch>/: otelcol-compy, its
# .version stamp, compy.app) that the darwin archives fold in — so the
# Homebrew cask's Caskroom staging dir holds the bundled collector and the
# app bundle right next to the compy binary, where compy's bundled-collector
# detection (internal/distro.Bundled) and the tray's window spawn
# (internal/tray windowExe) look for them after resolving the
# /opt/homebrew/bin/compy symlink.
version: 2

project_name: compy

before:
  hooks:
    - go mod download

builds:
  # darwin needs cgo; amd64 cross-compiles from the arm64 runner because
  # clang targets both architectures. The extras hook runs per darwin
  # target: each stages its own arch, the arm64 one also builds the linux
  # collector tarballs and the compy.app zip.
  - id: compy-darwin
    main: ./cmd/compy
    binary: compy
    env:
      - CGO_ENABLED=1
      # Wails references UTType without linking its framework.
      - CGO_LDFLAGS=-framework UniformTypeIdentifiers
    # Wails gates wails.Run behind its own build tags; without them
    # `compy window` errors at runtime.
    flags:
      - -tags=desktop,production
    goos: [darwin]
    goarch: [arm64, amd64]
    # Stamps the release version (compy version, /api/status compy_version);
    # unstamped builds render dev · <commit> from the VCS build info instead.
    ldflags:
      - -s -w -X github.com/bronto-community/compy/internal/version.release={{ .Version }}
    hooks:
      post:
        - cmd: sh .github/scripts/goreleaser-extras.sh "{{ .Path }}" "{{ .Target }}" "{{ .Version }}"
  # linux is the pure-Go stub build (no tray/window), same as the
  # cross-build gate in CI.
  - id: compy-linux
    main: ./cmd/compy
    binary: compy
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/bronto-community/compy/internal/version.release={{ .Version }}

archives:
  # The darwin archives carry the full install: compy plus the staged
  # otelcol-compy (+ .version) and compy.app from the extras hook, laid out
  # flat so extraction — including Homebrew's into the Caskroom — puts them
  # next to the binary.
  - id: compy-darwin
    ids: [compy-darwin]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - src: "dist/stage/{{ .Os }}_{{ .Arch }}/**"
        dst: .
  - id: compy-linux
    ids: [compy-linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: dist/extra/*.tar.gz
    - glob: dist/extra/compy.app.zip

# Keyless (OIDC) cosign signature over the checksums file: verifying one
# signature transitively verifies every archive and extra file via its
# checksum. Certificate identity is the release workflow itself. Same
# pattern (and cosign 2.x output format) as bronto-cli.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"

# SPDX SBOM per archive (syft), uploaded alongside the release assets.
sboms:
  - artifacts: archive

release:
  extra_files:
    - glob: dist/extra/*

# The tap already hosts bronto-cli as a GoReleaser-generated cask under
# Casks/, so compy follows the same layout. The HOMEBREW_TAP_TOKEN env
# var is a short-lived installation token minted per release run from the
# Bronto Community Bot app, scoped to contents:write on homebrew-tap.
homebrew_casks:
  - name: compy
    ids: [compy-darwin]
    directory: Casks
    description: Local OpenTelemetry Collector manager for the dev loop
    homepage: https://github.com/bronto-community/compy
    # compy's menu bar item is a login LaunchAgent, so adding it is the
    # user's call, not the installer's — see the hooks comment below.
    caveats: |
      compy's menu bar item is opt-in. To add it:

        compy tray install

      It then starts at login. Remove it from the danger area in compy's
      settings screen, or with `compy tray uninstall`.

      Uninstalling: `brew uninstall --zap compy` removes everything,
      including compy's login items. A plain `brew uninstall` leaves them
      behind; run `compy stop` and `compy tray uninstall` first.
    # No goreleaser field maps to `depends_on`, and custom_block is injected
    # at the top of the cask. brew style relocates it (and rewrites the value
    # to `macos: :big_sur`); the tap normalizes style on main, so the emitted
    # stanza order settling differently is expected and harmless.
    custom_block: |
      depends_on macos: ">= :big_sur"

      # Everything in the staged dir is unsigned/ad-hoc: strip quarantine
      # recursively so compy, otelcol-compy, and compy.app all run. This
      # exists only because nothing here is Developer ID notarized;
      # notarizing would let it be deleted outright.
      #
      # It lives here rather than in hooks.post.install because Homebrew
      # deprecated the legacy `postflight` Ruby block in favour of the
      # structured `postflight_steps` stanza, and no goreleaser field emits
      # the latter. The steps DSL takes no arbitrary Ruby: `system_command`
      # becomes `run`, and `staged_path` is a base symbol rather than a
      # method — the DSL already defaults to it, so "." and chdir resolve to
      # the staged dir. must_succeed: false replaces the old `xattr -h` probe.
      #
      # This deliberately does NOT run `compy tray install`. Installing a
      # login LaunchAgent is not something `brew install` should do behind
      # the user's back, and postflight_steps runs "in an isolated Ruby
      # subprocess without network or general home-directory access", which
      # is exactly what writing ~/Library/LaunchAgents and talking to
      # `launchctl gui/$UID` needs. The caveat tells the user to run it.
      postflight_steps do
        run "/usr/bin/xattr",
            args:         ["-dr", "com.apple.quarantine", "."],
            chdir:        ".",
            must_succeed: false
      end
    repository:
      owner: bronto-community
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The launchd jobs are zap-only, deliberately NOT under uninstall:
    # `brew upgrade` runs the old version's uninstall stanza before
    # installing the new one, and Homebrew's `uninstall launchctl:` both
    # removes the job AND deletes ~/Library/LaunchAgents/<label>.plist
    # (cask/artifact/abstract_uninstall.rb). Under uninstall, every upgrade
    # stopped the collector and deleted the tray's login item. Homebrew
    # offers no way to skip it on upgrade (`on_upgrade` covers `signal`
    # only). The cost: a plain `brew uninstall` leaves both jobs behind —
    # the caveat says to use --zap, or `compy stop` / `compy tray uninstall`
    # first.
    zap:
      launchctl:
        - io.bronto.compy.tray
        - io.bronto.compy.collector
      trash:
        - "~/Library/LaunchAgents/io.bronto.compy.tray.plist"
        - "~/Library/LaunchAgents/io.bronto.compy.collector.plist"
        - "~/Library/Application Support/compy"
