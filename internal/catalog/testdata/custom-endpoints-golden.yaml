receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:${env:COMPY_GRPC_PORT:-14317}  # compy's local gRPC port
      http:
        endpoint: 127.0.0.1:${env:COMPY_HTTP_PORT:-14318}  # compy's local HTTP port

# no sampling, deliberately: a dev loop emits tens of traces/sec; sampling belongs at the vendor edge
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  resource_detection:
    detectors: [env, system]
    override: false  # attributes the SDK set win
  cumulative_to_delta:
  batch:
    send_batch_size: 1024  # sized under the 1MB payload cap (the lowest vendor ceiling)
    send_batch_max_size: 1024
    timeout: 200ms

exporters:
  otlphttp/honeycomb:
    endpoint: https://api.honeycomb.io
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}  # honeycomb api key
    sending_queue:
      storage: file_storage  # survives restarts and offline stretches
    retry_on_failure:
      max_elapsed_time: 0  # retry forever; the queue holds telemetry until the backend answers
  otlphttp/dynatrace:
    endpoint: https://abc123.live.dynatrace.com/api/v2/otlp
    headers:
      Authorization: Api-Token ${env:DYNATRACE_API_KEY}  # dynatrace api key
      X-Tenant: tenant-1
    sending_queue:
      storage: file_storage  # survives restarts and offline stretches
    retry_on_failure:
      max_elapsed_time: 0  # retry forever; the queue holds telemetry until the backend answers
  debug:

extensions:
  file_storage:
    directory: "/home/u/compy/storage"
    create_directory: true

service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlphttp/honeycomb, otlphttp/dynatrace, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlphttp/honeycomb, debug]
    metrics/delta:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, cumulative_to_delta, batch]
      exporters: [otlphttp/dynatrace, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlphttp/honeycomb, otlphttp/dynatrace, debug]
