<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>compy</title>
<style>
  /* Stopgap UI for the v2 core: status + configuration picker. P3 rebuilds
     this properly (four views, CodeMirror editor). Brand tokens only —
     no font or image assets ship in this repo. */
  :root {
    --bg: #F7F4EC; --panel: #FFFFFF; --line: #E5E0D3; --ink: #1E1E1C;
    --muted: #6E6A60; --accent: #DE9200; --ok: #3E9B6E; --bad: #C4452F;
    --serif: "Source Serif 4", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: Inter, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: var(--sans); font-size: 13.5px; line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-family: var(--serif); font-size: 22px; margin: 0 0 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 26px 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 0;
         border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .meta, .status { color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block;
         background: var(--bad); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  button { cursor: pointer; font: inherit; border: 1px solid var(--line);
           background: var(--panel); border-radius: 7px; padding: 4px 12px; }
  button:hover { border-color: var(--accent); }
  button[disabled] { cursor: default; color: var(--muted); border-color: var(--line); }
  .active { color: var(--accent); font-weight: 600; }
  pre { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap;
        max-height: 240px; overflow: auto; margin: 0; color: var(--muted); }
  #error { color: var(--bad); min-height: 20px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>compy</h1>
  <div class="card" id="status">…</div>
  <div id="error"></div>

  <h2>Configurations</h2>
  <div class="card" id="configs">…</div>

  <h2>Collector log</h2>
  <div class="card"><pre id="log"></pre></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let active = "";

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

function renderStatus(s) {
  active = s.config || "";
  $("status").innerHTML = "";
  const line = document.createElement("div");
  line.innerHTML =
    `<span class="dot ${s.running ? "on" : ""}"></span>` +
    `<strong>${s.running ? "running" : "stopped"}</strong>` +
    ` — ${s.config ? `config <span class="active">${s.config}</span>` : "no configuration active"}` +
    `${s.set ? ` (set ${s.set})` : ""}`;
  const ports = document.createElement("div");
  ports.className = "meta";
  ports.textContent = `distro ${s.distro || "(none)"} · OTLP ${s.endpoint} · grpc ${s.grpc_port}`;
  $("status").append(line, ports);
}

function renderConfigs(list) {
  $("configs").innerHTML = "";
  for (const c of list || []) {
    const row = document.createElement("div");
    row.className = "row";
    const info = document.createElement("div");
    info.className = "grow";
    info.innerHTML = `<div class="name ${c.name === active ? "active" : ""}">${c.name}</div>` +
      `<div class="meta">${c.provenance}${c.modified ? " · locally modified" : ""}` +
      `${c.meta?.active_set ? " · set " + c.meta.active_set : ""}</div>`;
    const btn = document.createElement("button");
    btn.textContent = c.name === active ? "active" : "Use";
    btn.disabled = c.name === active;
    btn.onclick = () => act(btn, `/api/configs/${encodeURIComponent(c.name)}/activate`);
    row.append(info, btn);
    $("configs").append(row);
  }
}

async function act(btn, path) {
  btn.disabled = true;
  $("error").textContent = "";
  try {
    await api(path, { method: "POST" });
  } catch (e) {
    $("error").textContent = e.message;
  }
  refresh();
}

async function refresh() {
  try {
    renderStatus(await api("/api/status"));
    renderConfigs(await api("/api/configs"));
    $("log").textContent = (await api("/api/log")).log || "(empty)";
  } catch (e) {
    $("error").textContent = e.message;
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
