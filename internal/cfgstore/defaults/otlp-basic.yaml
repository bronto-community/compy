receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:${env:COMPY_GRPC_PORT:-14317}  # compy's local gRPC port
      http:
        endpoint: 127.0.0.1:${env:COMPY_HTTP_PORT:-14318}  # compy's local HTTP port
exporters:
  otlphttp:
    endpoint: ${env:OTLP_ENDPOINT:-http://127.0.0.1:4318}  # where to send (base URL; the collector appends /v1/traces etc.)
    headers:
      Authorization: Bearer ${env:OTLP_KEY:-}  # the backend's API key; empty sends an empty header
service:
  pipelines:
    traces: {receivers: [otlp], exporters: [otlphttp]}
    metrics: {receivers: [otlp], exporters: [otlphttp]}
    logs: {receivers: [otlp], exporters: [otlphttp]}
