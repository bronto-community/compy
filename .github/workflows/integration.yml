# Nightly end-to-end run against a real collector binary. The pinned
# contrib distro comes straight from internal/distro/defs.go: the URL and
# sha256 are parsed out of that file, so a collector bump PR updates this
# workflow's inputs automatically. Contrib rather than the minimal otlp
# distro because the shipped defaults use components (debug, batch,
# file_storage) the otlp build does not carry.
name: Integration

on:
  schedule:
    - cron: "17 3 * * *"
  # Collector-touching changes get the real-binary run before merge, not
  # only at the next nightly.
  pull_request:
    paths:
      - "internal/collector/**"
      - "internal/cfgstore/**"
      - "internal/distro/**"
      - "integration/**"
      - "go.mod"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download the pinned contrib collector
        run: |
          defs=internal/distro/defs.go
          base=$(sed -n 's/^const releaseBase = "\(.*\)"$/\1/p' "$defs")
          asset=$(awk -F'"' '$4 ~ /^otelcol-contrib_.*_linux_amd64\.tar\.gz$/ {print $4; exit}' "$defs")
          sha=$(awk -F'"' 'index($4, "otelcol-contrib_") {seen=1} seen && $2 == "linux_amd64" && $4 ~ /^[0-9a-f]+$/ && length($4) == 64 {print $4; exit}' "$defs")
          test -n "$base" && test -n "$asset" && test -n "$sha"
          curl -fsSL -o otelcol.tar.gz "$base$asset"
          echo "$sha  otelcol.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/otelcol"
          tar -xzf otelcol.tar.gz -C "$RUNNER_TEMP/otelcol"
          rm otelcol.tar.gz
      - name: go test -tags=integration
        run: OTELCOL_BIN="$RUNNER_TEMP/otelcol/otelcol-contrib" go test -tags=integration ./integration/
