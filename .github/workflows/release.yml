# Tag-driven releases: push a v* tag and GoReleaser builds the compy
# archives (darwin cgo arm64+amd64, linux CGO-off amd64+arm64), the
# otelcol-compy collector tarballs, and the compy.app zip, then publishes
# the GitHub release and the Homebrew cask. Runs on macOS because the
# darwin builds need cgo — which is also why there is no harden-runner
# step here: it only supports Linux runners. See
# .github/workflows/README.md for the secrets.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege at the top level; the release job grants itself exactly
# the write scopes it needs.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: macos-15
    permissions:
      contents: write # create the GitHub Release + upload assets
      id-token: write # cosign keyless signing (OIDC) + provenance attestation
      attestations: write # actions/attest-build-provenance stores signed SLSA provenance
    # The most credential-dense job in the repo (release token, the minted
    # tap token, OIDC signing) sits behind the protected `release`
    # environment: a v* tag push waits for a human approval before any of
    # these credentials exist.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Pin the TOOL, not just the installer action: cosign v3 changed
          # sign-blob to require --bundle; v2.6.x produces the .sig/.pem
          # outputs the goreleaser signs block and SECURITY.md depend on.
          cosign-release: "v2.6.0"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Mint homebrew-tap token
        # Short-lived installation token from the Bronto Community Bot app,
        # scoped to contents:write on homebrew-tap only. The default
        # GITHUB_TOKEN cannot push cross-repo, and a long-lived PAT would
        # outlive every release that uses it.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: tap-token
        with:
          app-id: ${{ secrets.BRONTO_COMMUNITY_BOT_APP_ID }}
          private-key: ${{ secrets.BRONTO_COMMUNITY_BOT_PRIVATE_KEY }}
          owner: bronto-community
          repositories: homebrew-tap
          permission-contents: write

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact-pinned like cosign above: this is the most
          # credential-dense step in the repo, so it must not float to
          # whatever v2.x was published last.
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}

      # Signed SLSA build provenance for every release artifact.
      # goreleaser's checksums.txt lists them all, so one attestation over
      # the checksum file covers each artifact — the same
      # verify-one-file-covers-all pattern as the cosign signature. Verify
      # with: gh attestation verify <artifact> --repo bronto-community/compy
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
