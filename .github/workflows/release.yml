# Tag-driven releases: push a v* tag and GoReleaser builds the compy
# archives (darwin cgo arm64+amd64, linux CGO-off amd64+arm64), the
# otelcol-compy collector tarballs, and the compy.app zip, then publishes
# the GitHub release and the Homebrew cask. Runs on macOS because the
# darwin builds need cgo. See .github/workflows/README.md for the secrets.
name: Release

on:
  push:
    tags: ["v*"]

permissions: read-all

jobs:
  goreleaser:
    runs-on: macos-15
    permissions:
      contents: write  # publish the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Decide whether the cask can be published
        id: cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping the Homebrew cask" >&2
            echo "skip=--skip=homebrew" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean ${{ steps.cask.outputs.skip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
