# CI: the same gates as README.md's Development section, on every PR and
# push to main. The macOS job exists because the darwin-tagged tray/window/
# app tests only compile there.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: js helper tests (node stdlib runner, no npm)
        run: node --test internal/webui/static/*.test.js
      - name: linux cross-build (CGO off)
        run: GOOS=linux CGO_ENABLED=0 go build -o /dev/null ./cmd/compy

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # The shippable darwin build: Wails needs its desktop,production
      # tags (untagged `compy window` errors at runtime) and a framework
      # it references but does not link.
      - name: tagged window build
        run: go build -tags desktop,production -o /dev/null ./cmd/compy
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers

  # The Homebrew cask is generated here but was only ever discovered
  # downstream, in the tap — which is why a template offence went unnoticed
  # for six releases. Render the cask with a snapshot release and run the
  # tap's own gates against it, before a tag exists.
  cask:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Render the cask
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Same pin as release.yml, so this validates what a release renders.
          version: v2.17.0
          args: release --snapshot --clean --skip=publish,sign,sbom,announce
        env:
          # The extras hook's OCB collector builds are slow and irrelevant to
          # the cask template; the hook documents this switch for exactly this.
          SKIP_COLLECTOR: "1"
      - name: Check the rendered cask
        run: |
          TAP="$(brew --repository)/Library/Taps/compy-cask-check/homebrew-tap"
          mkdir -p "$TAP/Casks"
          cp dist/homebrew/Casks/compy.rb "$TAP/Casks/compy.rb"
          # No `brew trust` needed: naming the tap or a fully qualified cask on
          # the command line is itself the authorisation (Homebrew's
          # Trust::explicitly_allowed?), and every call below does.

          # goreleaser's built-in template is not style-clean and offers no
          # knob to change it, so the tap normalizes style on main instead.
          # The gate is therefore "everything goreleaser emits is
          # autocorrectable", not "the render is already clean": if a
          # non-correctable offence ever appears, normalization cannot save
          # the tap and this fails.
          brew style --fix compy-cask-check/tap || true
          if ! brew style compy-cask-check/tap; then
            echo "::error::Rendered cask has offences that brew style --fix cannot repair." \
                 "The tap's normalize step will not be able to fix this either."
            exit 1
          fi

          # Offline only: a snapshot cask's URLs and checksums are synthetic,
          # so --online would fail on the fabricated version. The tap runs the
          # online audit against the real published assets.
          brew audit --cask --strict compy-cask-check/tap/compy
