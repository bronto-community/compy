# CI: the same gates as README.md's Development section, on every PR and
# push to main. The macOS job exists because the darwin-tagged tray/window/
# app tests only compile there.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: js helper tests (node stdlib runner, no npm)
        run: node --test internal/webui/static/*.test.js
      - name: linux cross-build (CGO off)
        run: GOOS=linux CGO_ENABLED=0 go build -o /dev/null ./cmd/compy

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # The shippable darwin build: Wails needs its desktop,production
      # tags (untagged `compy window` errors at runtime) and a framework
      # it references but does not link.
      - name: tagged window build
        run: go build -tags desktop,production -o /dev/null ./cmd/compy
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
