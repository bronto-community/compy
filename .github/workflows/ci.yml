# CI: the same gates as README.md's Development section, on every PR and
# push to main. The macOS job exists because the darwin-tagged tray/window/
# app tests only compile there.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: linux cross-build (CGO off)
        run: GOOS=linux CGO_ENABLED=0 go build -o /dev/null ./cmd/compy

  # macOS minutes cost 10x on private repos, so this job skips PRs and only
  # runs on push to main and manual dispatch. Widen it to pull_request when
  # the repo goes public (public-repo minutes are free).
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
